name = "hoops-moves-multiplayer"
main = "worker.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "HOOPS_ROOM", class_name = "HoopsRoom" },
  { name = "HOOPS_LOBBY", class_name = "HoopsLobby" }
]

[[migrations]]
tag = "v1"
new_classes = ["HoopsRoom"]

[[migrations]]
tag = "v2"
new_classes = ["HoopsLobby"]
